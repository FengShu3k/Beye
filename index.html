        // 知识图谱组件
        function KnowledgeGraph() {
            const width = 800;
            const height = 600;

            // 创建节点和链接数据
            const nodes = [];
            const links = [];

            // 添加食物节点
            FOOD_DATA.forEach(food => {
                nodes.push({ id: food.id, group: 'food', label: food.name, x: Math.random() * width, y: Math.random() * height });
                
                // 添加地域节点
                if (!nodes.some(n => n.id === `region-${food.region}`)) {
                    nodes.push({ id: `region-${food.region}`, group: 'region', label: food.region });
                }
                links.push({ source: food.id, target: `region-${food.region}`, type: 'found_in' });
                
                // 添加环境节点
                if (!nodes.some(n => n.id === `env-${food.environment}`)) {
                    nodes.push({ id: `env-${food.environment}`, group: 'environment', label: food.environment });
                }
                links.push({ source: food.id, target: `env-${food.environment}`, type: 'survives_in' });
                
                // 添加处理方式节点
                if (!nodes.some(n => n.id === `method-${food.eatingMethod}`)) {
                    nodes.push({ id: `method-${food.eatingMethod}`, group: 'method', label: food.eatingMethod });
                }
                links.push({ source: food.id, target: `method-${food.eatingMethod}`, type: 'processed_by' });
            });

            // 创建SVG
            const svg = d3.create("svg")
                .attr("viewBox", [0, 0, width, height])
                .attr("width", "100%")
                .attr("height", "100%")
                .style("background", "#1a202c");

            // 创建力导向图
            const simulation = d3.forceSimulation(nodes)
                .force("link", d3.forceLink(links).id(d => d.id).distance(100))
                .force("charge", d3.forceManyBody().strength(-300))
                .force("center", d3.forceCenter(width / 2, height / 2))
                .force("collision", d3.forceCollide().radius(30));

            // 添加链接
            const link = svg.append("g")
                .attr("stroke", "#64748b")
                .attr("stroke-width", 1.5)
                .selectAll("line")
                .data(links)
                .join("line");

            // 添加节点
            const node = svg.append("g")
                .attr("stroke", "#fff")
                .attr("stroke-width", 1.5)
                .selectAll("circle")
                .data(nodes)
                .join("circle")
                .attr("r", d => d.group === 'food' ? 8 : 6)
                .attr("fill", d => {
                    if (d.group === 'food') return "#10b981"; // 绿色 - 食物
                    if (d.group === 'region') return "#f59e0b"; // 黄色 - 地域
                    if (d.group === 'environment') return "#3b82f6"; // 蓝色 - 环境
                    if (d.group === 'method') return "#ec4899"; // 粉色 - 方法
                    return "#94a3b8"; // 灰色 - 其他
                })
                .call(drag(simulation));

            // 添加标签
            const label = svg.append("g")
                .attr("class", "labels")
                .selectAll("text")
                .data(nodes)
                .join("text")
                .text(d => d.label)
                .attr("font-size", 10)
                .attr("dx", 12)
                .attr("dy", 4)
                .attr("fill", "#e2e8f0");

            // 更新位置
            simulation.on("tick", () => {
                link
                    .attr("x1", d => d.source.x)
                    .attr("y1", d => d.source.y)
                    .attr("x2", d => d.target.x)
                    .attr("y2", d => d.target.y);

                node
                    .attr("cx", d => d.x)
                    .attr("cy", d => d.y);

                label
                    .attr("x", d => d.x)
                    .attr("y", d => d.y);
            });

            // 拖拽功能
            function drag(simulation) {
                function dragstarted(event, d) {
                    if (!event.active) simulation.alphaTarget(0.3).restart();
                    d.fx = d.x;
                    d.fy = d.y;
                }
                
                function dragged(event, d) {
                    d.fx = event.x;
                    d.fy = event.y;
                }
                
                function dragended(event, d) {
                    if (!event.active) simulation.alphaTarget(0);
                    d.fx = null;
                    d.fy = null;
                }
                
                return d3.drag()
                    .on("start", dragstarted)
                    .on("drag", dragged)
                    .on("end", dragended);
            }

            // 添加图例
            const legend = svg.append("g")
                .attr("class", "legend")
                .attr("transform", "translate(20,20)");

            const legendItems = [
                { color: "#10b981", label: "食物" },
                { color: "#f59e0b", label: "地域" },
                { color: "#3b82f6", label: "环境" },
                { color: "#ec4899", label: "处理方式" }
            ];

            legendItems.forEach((item, i) => {
                const g = legend.append("g")
                    .attr("transform", `translate(0,${i * 20})`);

                g.append("circle")
                    .attr("r", 6)
                    .attr("cx", 0)
                    .attr("cy", 0)
                    .attr("fill", item.color);

                g.append("text")
                    .attr("x", 12)
                    .attr("y", 4)
                    .attr("fill", "#e2e8f0")
                    .text(item.label);
            });

            return svg.node();
        }

                });

                        <main class="container mx-auto px-4 py-8">

                            </div>

                            ${state.viewMode === 'grid' ? `

                // 如果是图谱模式，创建知识图谱

                // 添加全局函数
                window.updateState = (newState) => {

                window.selectFood = (foodId) => {
